<svg xmlns="http://www.w3.org/2000/svg" width="1060" height="390" viewBox="0 0 1060 390" role="img" aria-labelledby="title desc">
  <title id="title">codex-app-send terminal demo — illustration</title>
  <desc id="desc">Illustrative output for codex-app-send --wait 900 ~/projects/my-app @task.md: SENT marker, SESSION rollout path, FINAL separator, and a sample summary listing changed files, 12 passing tests and a remaining manual UI check. Paths are abbreviated; this is not an actual test result.</desc>
  <rect width="1060" height="390" rx="20" fill="#101827"/>
  <path d="M 20 0 H 1040 Q 1060 0 1060 20 V 56 H 0 V 20 Q 0 0 20 0" fill="#233149"/>
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
    <text x="32" y="35" font-size="16" font-weight="700" letter-spacing="1" fill="#e3ebf8">TERMINAL / ILLUSTRATION</text>
    <text x="1028" y="35" text-anchor="end" font-size="16" fill="#c2cee0">Sample output · abbreviated paths</text>
  </g>
  <g font-family="'SFMono-Regular', Consolas, 'Liberation Mono', monospace" font-size="21">
    <text x="32" y="104" fill="#f4f7fc"><tspan fill="#97e8cc">$ </tspan>codex-app-send --wait 900 ~/projects/my-app @task.md</text>
    <text x="32" y="150" fill="#c2cee0"><tspan fill="#97e8cc">SENT </tspan>ccb-1791774736-35981-17635</text>
    <text x="32" y="186" fill="#c2cee0"><tspan fill="#94bdff">SESSION </tspan>~/.codex/sessions/2026/10/12/rollout-....jsonl</text>
    <text x="32" y="232" fill="#94bdff">----- FINAL -----</text>
    <text x="32" y="270" fill="#f4f7fc">Changed: src/search.ts, tests/search.test.ts.</text>
    <text x="32" y="306" fill="#97e8cc">Tests: 12 passed, 0 failed.</text>
    <text x="32" y="342" fill="#f5d39a">Risk: search behavior still needs a manual UI check.</text>
  </g>
</svg>
